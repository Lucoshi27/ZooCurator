
<!-- ZOO CURATOR V220.27 -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Zoo Curator</title>

    <!--
        Use a fixed deployment version instead of Date.now(). Phones can now
        reuse the cached stylesheet between visits. Change this value only
        when style.css is actually updated.
    -->
    <script>
        // One deployment key for the complete app shell. Change only when a
        // new build is deployed, so Safari cannot mix files from two builds.
        (function () {
            var version = 'V220.27';
            window.__zooBuildVersion = version;
            var stylesheet = document.createElement('link');
            stylesheet.rel = 'stylesheet';
            stylesheet.href = './style.css?v=' + encodeURIComponent(version);
            document.head.appendChild(stylesheet);
        }());
    </script>
</head>

<body>

    <!-- =====================================================
         LOADING SCREEN
         ===================================================== -->

    <div id="bootScreen">

        <div id="bootTitle">
            Zoo Curator
        </div>

        <div id="bootStatus">
            Loading Zoo Curator...
        </div>

        <div id="bootDetail">
            Starting...
        </div>
    </div>


    <!-- =====================================================
         ERROR SCREEN
         ===================================================== -->

    <div id="fatalError"></div>


    <!-- =====================================================
         GAME
         ===================================================== -->

    <div id="gameApp">

        <!-- =================================================
             HEADER
             ================================================= -->

        <header id="actionMenu">

            <div id="playerZooName">
                Loading Zoo...
            </div>


            <!-- LEFT SIDE -->

            <div
                id="headerLeft"
                class="header-side"
            >

                <div
                    id="turnOrder"
                    class="header-small"
                >
                    Turn 1
                </div>

            </div>


            <!-- CENTER ACTIONS -->

            <div id="headerActions">

                <div
                    id="exchangeControls"
                    class="exchange-controls"
                >

                    <!-- DRAW LEVEL 1 -->

                    <button
                        id="drawCard"
                        class="action-card draw-card"
                        type="button"
                        aria-label="Draw Level 1 Animal"
                    >
                        <img
                            src="assets/animals/carnivora/1/Back.png"
                            alt="Draw Level 1 Animal"
                            width="100"
                            height="144"
                            style="display:block;width:100px;height:144px;object-fit:fill;"
                            draggable="false"
                        >
                    </button>


                    <!-- EXCHANGE 1 -->

                    <div
                        id="exchange1"
                        class="action-slot"
                    ></div>


                    <!-- EXCHANGE 2 -->

                    <div
                        id="exchange2"
                        class="action-slot"
                    ></div>


                    <!-- RESULT -->

                    <div
                        id="result"
                        class="exchange-result"
                    ></div>


                    <!-- OUTGOING OFFER -->

                    <div
                        id="outgoingOffer"
                        class="trade-offer"
                    >
                        OUTGOING<br>
                        OFFER
                    </div>


                    <!-- INCOMING OFFER -->

                    <div
                        id="ingoingOffer"
                        class="trade-offer"
                    >
                        INGOING<br>
                        OFFER
                    </div>

                </div>

            </div>


            <!-- OPPONENT ZOOS -->

            <div
                id="opponentZoos"
                class="opponent-zoos"
            >

                <div class="opponent-title">
                    Opponents
                </div>

                <div
                    id="opponentName1"
                    class="opponent-name"
                >
                    Loading...
                </div>

                <div
                    id="opponentName2"
                    class="opponent-name"
                >
                    Loading...
                </div>

                <div
                    id="opponentName3"
                    class="opponent-name"
                >
                    Loading...
                </div>

            </div>

        </header>


        <!-- =================================================
             ZOO WORK AREA
             ================================================= -->

        <main
            id="zooBoard"
            class="zoo-board"
        >

            <div
                id="zooCanvas"
                class="zoo-canvas"
            ></div>

        </main>


        <!-- =================================================
             HOVER PREVIEW
             ================================================= -->

        <div
            id="hoverPreview"
            class="hover-preview"
            aria-hidden="true"
            style="visibility:hidden;opacity:0;pointer-events:none;"
        >

            <img
                id="hoverPreviewImage"
                src=""
                alt=""
                draggable="false"
            >

        </div>

    </div>
    <!-- =====================================================
         GAME SCRIPT
         ===================================================== -->
    <script>
        (function () {
            var version = String(window.__zooBuildVersion || 'V220.27');

            var translations = document.createElement('script');
            translations.src = './translations-nl.js?v=' + version;
            translations.onerror = function () {
                console.warn('Dutch translations unavailable; continuing in English.');
            };
            document.body.appendChild(translations);

            var game = document.createElement('script');
            game.src = './game.js?v=' + version;
            game.onerror = function () {
                var status = document.getElementById('bootStatus');
                var detail = document.getElementById('bootDetail');
                if (status) status.textContent = 'Zoo Curator could not load game.js.';
                if (detail) detail.textContent = 'Reload the page. If this remains, check that game.js is deployed beside index.html.';
            };
            document.body.appendChild(game);
        }());
    </script>

</body>
</html>
