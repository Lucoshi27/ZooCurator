
<!--
    ZOO CURATOR V76 — DRAG + COMPATIBILITY HOVER FIXES
    Known-good GitHub baseline. Future builds must descend from this version.
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Zoo Curator</title>

    <!--
        Use a fixed deployment version instead of Date.now(). Phones can now
        reuse the cached stylesheet between visits. Change this value only
        when style.css is actually updated.
    -->
    <link rel="stylesheet" href="./style.css?v=20260920-mobile-loader-1">
</head>

<body>

    <!-- =====================================================
         LOADING SCREEN
         ===================================================== -->

        <div id="bootTitle">
            Zoo Curator
        </div>

        <div id="bootStatus">

        </div>

        <div id="bootDetail">
            Starting...
        </div>

    </div>


    <!-- =====================================================
         ERROR SCREEN
         ===================================================== -->

    <div id="fatalError"></div>


    <!-- =====================================================
         GAME
         ===================================================== -->

    <div id="gameApp">

        <!-- =================================================
             HEADER
             ================================================= -->

        <header id="actionMenu">

            <div id="playerZooName">
                Loading Zoo...
            </div>


            <!-- LEFT SIDE -->

            <div
                id="headerLeft"
                class="header-side"
            >

                <div
                    id="turnOrder"
                    class="header-small"

                    Turn 1
                </div>

            </div>


            <!-- CENTER ACTIONS -->

            <div id="headerActions">

                <div
                    id="exchangeControls"
                    class="exchange-controls"
                >

                    <!-- DRAW LEVEL 1 -->

                    <button
                        id="drawCard"
                        class="action-card draw-card"
                        type="button"
                        aria-label="Draw Level 1 Animal"
                    >
                        <img
                            src="assets/animals/carnivora/1/Back.png"
                            alt="Draw Level 1 Animal"

                        >
                    </button>


                    <!-- EXCHANGE 1 -->

                    <div
                        id="exchange1"

                    ></div>


                    <!-- EXCHANGE 2 -->

                    <div
                        id="exchange2"
                        class="action-slot"
                    ></div>


                    <!-- RESULT -->

                    <div

                        class="exchange-result"
                    ></div>


                    <!-- OUTGOING OFFER -->

                    <div
                        id="outgoingOffer"
                        class="trade-offer"
                    >
                        OUTGOING<br>
                        OFFER
                    </div>


                    <!-- INCOMING OFFER -->

                    <div
                        id="ingoingOffer"
                        class="trade-offer"
                    >
                        INGOING<br>
                        OFFER
                    </div>

                </div>

            </div>


            <!-- OPPONENT ZOOS -->

            <div
                id="opponentZoos"
                class="opponent-zoos"
            >

                <div class="opponent-title">
                    Opponents
                </div>

                <div
                    id="opponentName1"
                    class="opponent-name"
                >
                    Loading...
                </div>

                <div
                    id="opponentName2"
                    class="opponent-name"
                >
                    Loading...
                </div>

                <div
                    id="opponentName3"
                    class="opponent-name"
                >
                    Loading...
                </div>

            </div>

        </header>


        <!-- =================================================
             ZOO WORK AREA
             ================================================= -->

        <main
            id="zooBoard"
            class="zoo-board"
        >

            <div
                id="zooCanvas"
                class="zoo-canvas"
            ></div>

        </main>


        <!-- =================================================
             HAND
             ================================================= -->

            id="hand"
            class="hand"
        ></div>


        <!-- =================================================
             HOVER PREVIEW
             ================================================= -->

        <div

        >

            <img
                id="hoverPreviewImage"
                src=""
                alt=""
                draggable="false"
            >

        </div>

    </div>


    <!-- =====================================================
         MOBILE-SAFE STARTUP / ERROR WATCHDOG
         ===================================================== -->

    <script>
        (function () {
            window.__zooScriptStarted = false;
            window.__zooGameReady = false;

            function bootElement(id) {
                return document.getElementById(id);
            }

            function makeBootVisible() {
                var boot = bootElement('bootScreen');
                if (!boot) return;

                // Inline fallbacks deliberately duplicate the essential CSS.
                // If style.css is missing/stale on a phone, startup text still
                // remains visible instead of leaving a featureless page.
                boot.style.position = 'fixed';
                boot.style.left = '0';
                boot.style.top = '0';
                boot.style.right = '0';
                boot.style.bottom = '0';
                boot.style.zIndex = '10000';
                boot.style.display = 'flex';
                boot.style.flexDirection = 'column';
                boot.style.alignItems = 'center';
                boot.style.justifyContent = 'center';
                boot.style.padding = '24px';
                boot.style.background = '#e7e4dc';
                boot.style.color = '#222';
                boot.style.fontFamily = 'Arial, Helvetica, sans-serif';
                boot.style.textAlign = 'center';
            }

            function showStartupProblem(title, detail) {
                if (window.__zooGameReady) return;

                makeBootVisible();

                var status = bootElement('bootStatus');
                var info = bootElement('bootDetail');

                if (status) status.textContent = title || 'Zoo Curator could not start.';
                if (info) info.textContent = detail || 'Reload the page. If this keeps happening, send this message with your phone/browser type.';
            }

            makeBootVisible();

            window.addEventListener('error', function (event) {
                if (window.__zooGameReady) return;

                var target = event.target;
                if (
                    target &&
                    target.tagName === 'SCRIPT' &&
                    /(?:^|\/)game\.js(?:\?|$)/.test(target.src || '')
                ) {
                    showStartupProblem(
                        'Zoo Curator could not load game.js.',
                        'The game script was blocked, missing, or an old cached copy was used. Reload the page.'
                    );
                    return;
                }

                if (!window.__zooScriptStarted) {
                    showStartupProblem(
                        'Zoo Curator could not start.',
                        (event.message || 'JavaScript failed before startup.') +
                        (event.filename ? ' — ' + event.filename + ':' + (event.lineno || '') : '')
                    );
                }
            }, true);

            window.addEventListener('unhandledrejection', function (event) {
                if (window.__zooGameReady) return;
                var reason = event.reason;
                showStartupProblem(
                    'Zoo Curator hit a startup error.',
                    reason && (reason.message || reason.toString) ?
                        (reason.message || String(reason)) :
                        'A startup promise failed.'
                );
            });

            // Never allow a phone to sit on an unexplained blank/loading page.
            window.setTimeout(function () {
                if (window.__zooGameReady) return;
                showStartupProblem(
                    'Zoo Curator is taking longer than expected.',
                    'Startup has not finished after 45 seconds. Check the connection and reload. The game now times out stalled data/image requests instead of waiting forever.'
                );
            }, 45000);
        }());
    </script>


    <!-- =====================================================
         GAME SCRIPT
         ===================================================== -->

    <script>
        // Start the optional translations and the game independently. The old
        // loader waited for translations-nl.js before it even requested
        // game.js; a stalled translation request could therefore prevent the
        // game from starting indefinitely on mobile Safari.
        (function () {
            var version = '20260920-mobile-loader-1';

            function refreshDutchUi() {
                // Usually translations finish first because the file is much
                // smaller than game.js. If they finish second, refresh the
                // already-running game without making translations mandatory.
                try {
                    if (typeof window.localizeDocument === 'function') {
                        window.localizeDocument();
                    }
                    if (
                        window.__zooGameReady &&
                        typeof window.renderAll === 'function'
                    ) {
                        window.renderAll();
                    }
                } catch (error) {
                    console.warn('Could not refresh translated UI:', error);
                }
            }

            function loadGame() {
                var script = document.createElement('script');
                script.src = './game.js?v=' + version;
                script.onerror = function () {
                    var s = document.getElementById('bootStatus');
                    var d = document.getElementById('bootDetail');
                    if (s) s.textContent = 'Zoo Curator could not load game.js.';
                    if (d) d.textContent =
                        'Reload the page. If this remains, the deployed game.js path or cache is wrong.';
                };
                document.body.appendChild(script);
            }

            // Translations remain optional and download in parallel.
            var translations = document.createElement('script');
            translations.src = './translations-nl.js?v=' + version;
            translations.onload = refreshDutchUi;
            translations.onerror = function () {
                console.warn('Dutch translations could not be loaded; continuing in English.');
            };
            document.body.appendChild(translations);

            loadGame();
        }());
    </script>

</body>
</html>
